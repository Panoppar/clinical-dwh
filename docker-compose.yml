name: clinical-dwh

# ============================================================================
# Regional Health & Population Data Warehouse — orchestration
#
#   warehouse-db  : MySQL DWH hosting the bronze / silver / gold schemas,
#                   fully populated. 12 sources (10 live, 2 file-based for a
#                   deliberate, scoped set of gaps -- see
#                   docs/06_kmch_ml_gap_closure_plan.md and
#                   docs/03_external_reference_sources.md), 38+ Bronze/Silver
#                   tables, 18+ Gold tables feeding 4 Metabase dashboards.
#   elt-runner    : one-shot Python job that executes the full
#                   Bronze -> Silver -> Gold pipeline, then exits (run
#                   again any time with `docker compose run --rm elt-runner`)
#   metabase      : BI tool, connects ONLY to warehouse-db.gold via the
#                   read-only metabase_ro account.
#   landing-zone  : S3-compatible landing zone (SeaweedFS -- MinIO's free
#                   container distribution was discontinued across every
#                   registry as of this build, confirmed by direct testing)
#                   for every live-API/file-based Bronze source. Raw
#                   responses land here, versioned and content-hashed (see
#                   pipeline/landing_store.py), before Bronze shreds them
#                   into tables -- elt-runner itself never writes these
#                   bytes to its own container filesystem.
#
# Logging: every service caps its own json-file log at a small, fixed size
# (x-logging below) -- Docker's default driver has no cap at all, and on a
# small production VM an unbounded log (especially elt-runner's per-request
# HDC crawl chatter, ~1,100 requests/run) can fill the disk over time
# unnoticed. 3MB x 2 files = 6MB worst case per service; deliberately tight
# since these logs are for transient troubleshooting, not an audit trail
# (every pipeline run's real provenance already lives in the warehouse
# itself -- ingestion_batch_id, source_file_name, ingested_at on every
# Bronze row, plus the versioned landing zone).
# ============================================================================

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "3m"
    max-file: "2"

services:

  warehouse-db:
    image: mysql:8.0
    container_name: cdw-warehouse-db
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${DWH_DB_ROOT_PASSWORD}
      MYSQL_USER: ${DWH_DB_USER}
      MYSQL_PASSWORD: ${DWH_DB_PASSWORD}
      TZ: Asia/Bangkok
    ports:
      # Bound to loopback only -- nothing outside this host needs direct DB
      # access; Metabase reaches it over the internal cdw-net bridge network
      # regardless of this binding. Safe for local dev too (localhost
      # resolves to 127.0.0.1), and means nothing here is reachable from a
      # VM's public interface unless deliberately changed.
      - "127.0.0.1:${DWH_DB_HOST_PORT}:3306"
    volumes:
      - warehouse_db_data:/var/lib/mysql
      # Bootstraps empty bronze/silver/gold schemas + grants on first boot
      - ./sql/00_init_schemas_and_grants.sql:/docker-entrypoint-initdb.d/00_init_schemas_and_grants.sql:ro
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DWH_DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - cdw-net

  elt-runner:
    build:
      context: ./pipeline
    container_name: cdw-elt-runner
    logging: *default-logging
    environment:
      DWH_DB_HOST: ${DWH_DB_HOST}
      DWH_DB_PORT: ${DWH_DB_PORT}
      DWH_DB_USER: root
      DWH_DB_PASSWORD: ${DWH_DB_ROOT_PASSWORD}
      LANDING_ENDPOINT: ${LANDING_ENDPOINT}
      LANDING_ACCESS_KEY: ${LANDING_ACCESS_KEY}
      LANDING_SECRET_KEY: ${LANDING_SECRET_KEY}
      LANDING_BUCKET: ${LANDING_BUCKET}
    volumes:
      - ./sql:/app/sql:ro
      - ./external-inputs:/app/external-inputs:ro
    depends_on:
      warehouse-db:
        condition: service_healthy
      landing-zone:
        condition: service_healthy
    networks:
      - cdw-net
    # No `restart` on purpose: this is a run-to-completion batch job, not a daemon.
    profiles: ["etl"]

  landing-zone:
    image: chrislusf/seaweedfs:latest
    container_name: cdw-landing-zone
    restart: unless-stopped
    logging: *default-logging
    # all-in-one mode (master+volume+filer+S3 gateway) for a single-node
    # dev landing zone; -s3.config provides the access/secret key pair
    # elt-runner authenticates with (see seaweedfs_s3_config.json)
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3_config.json
    volumes:
      - landing_zone_data:/data
      - ./seaweedfs_s3_config.json:/etc/seaweedfs/s3_config.json:ro
    ports:
      # Bound to loopback only -- see warehouse-db's port comment above for why.
      - "127.0.0.1:${LANDING_S3_HOST_PORT}:8333"
      # Filer web UI -- SeaweedFS's own browsable file explorer for the
      # landing zone (folders/objects/metadata, download/preview), the
      # "server" command already runs it internally, this just exposes it
      # to the host. http://localhost:${LANDING_FILER_UI_HOST_PORT}
      - "127.0.0.1:${LANDING_FILER_UI_HOST_PORT}:8888"
    healthcheck:
      # 403 Forbidden (unauthenticated GET /) is the correct, healthy
      # response from the S3 gateway -- wget's -q/-O would treat that as
      # a failure, so this just confirms the HTTP round-trip completes at
      # all. 127.0.0.1 (not localhost) avoids an IPv6-first resolution
      # hang observed in this image.
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://127.0.0.1:8333"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - cdw-net

  metabase:
    image: metabase/metabase:v0.50.19
    container_name: cdw-metabase
    restart: unless-stopped
    logging: *default-logging
    ports:
      # Bound to loopback by default too -- see warehouse-db's port comment
      # above. On a VM, reach this via an SSH tunnel for a quick check
      # (`ssh -L 3000:localhost:3000 user@vm`) or front it with a reverse
      # proxy (Caddy/nginx + TLS) bound to the VM's public interface and
      # forwarding to 127.0.0.1:3000 for real end-user access -- Metabase
      # has no TLS of its own. Change this binding to "0.0.0.0:..." instead
      # if this host is already behind its own trusted network boundary.
      - "127.0.0.1:${METABASE_HOST_PORT}:3000"
    environment:
      MB_JETTY_PORT: ${MB_JETTY_PORT}
      JAVA_TIMEZONE: Asia/Bangkok
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      warehouse-db:
        condition: service_healthy
    networks:
      - cdw-net

networks:
  cdw-net:
    driver: bridge

volumes:
  warehouse_db_data:
  metabase_data:
  landing_zone_data:
